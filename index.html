<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FEF8F5" />
    <meta
      name="description"
      content="ExitOS is a backup withdrawal page for DeFi vaults. Save a verified recovery kit, then withdraw to your wallet if the usual website goes offline."
    />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>ExitOS | Backup withdrawals for DeFi</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("exitos.theme") ||
          (matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
      } catch {}
      document
        .querySelector('meta[name="theme-color"]')
        .setAttribute(
          "content",
          document.documentElement.dataset.theme === "dark"
            ? "#231F20"
            : "#FEF8F5",
        );
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
